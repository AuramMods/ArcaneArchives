plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'com.aranaira.arcanearchives'
version = "${minecraft_version}-${mod_version}"
base.archivesName = mod_id
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    gameTest {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDirectory project.file("run/${name}")
            mods {
                arcanearchives { source sourceSets.main }
            }
        }
        client {}
        server {
            args '--nogui'
            property 'java.awt.headless', 'true'
        }
        gameTestServer {
            property 'java.awt.headless', 'true'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                arcanearchives { source sourceSets.gameTest }
            }
        }
    }
}

repositories {
    maven {
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'com.blamejared.crafttweaker'
            includeGroup 'vazkii.botania'
        }
    }
    maven {
        url = 'https://www.cursemaven.com/'
        content {
            includeModule 'curse.maven', 'jade-324717'
            includeModule 'curse.maven', 'the-one-probe-245211'
            includeModule 'curse.maven', 'game-stages-268655'
            includeModule 'curse.maven', 'recipe-stages-280554'
        }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeModule 'maven.modrinth', 'quark' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1:api')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.20.0.129')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge-api:15.20.0.129')
    compileOnly fg.deobf('com.blamejared.crafttweaker:CraftTweaker-forge-1.20.1:14.0.61') {
        transitive = false
    }
    compileOnly fg.deobf('curse.maven:jade-324717:6855440')
    compileOnly fg.deobf('curse.maven:the-one-probe-245211:9523565')
    compileOnly fg.deobf('curse.maven:game-stages-268655:5790361') { transitive = false }
    compileOnly fg.deobf('curse.maven:recipe-stages-280554:5173574') { transitive = false }
    compileOnly fg.deobf('vazkii.botania:Botania:1.20.1-456-FORGE:api') {
        transitive = false
    }
    compileOnly fg.deobf('maven.modrinth:quark:DijQLauD') {
        transitive = false
    }
}

tasks.named('processResources', ProcessResources) {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/mods.toml') {
        expand mod_version: mod_version
    }
}

tasks.named('jar', Jar) {
    from('LICENSE', 'CREDITS.md')
    finalizedBy 'reobfJar'
}

tasks.matching { it.name in ['runServer', 'runGameTestServer'] }.configureEach {
    def runName = name == 'runServer' ? 'server' : 'gameTestServer'
    doFirst {
        def eula = file("run/${runName}/eula.txt")
        eula.parentFile.mkdirs()
        eula.text = 'eula=true\n'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
